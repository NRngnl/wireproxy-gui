name: Release

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-release.sh
      - internal/ui/**
      - cmd/wireproxy-gui/**

permissions:
  contents: write

env:
  APP_ID: com.github.nrngnl.wireproxy-gui

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test -tags=ci -count=1 ./...

  prepare-release:
    name: Prepare draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --draft \
              --title "Wireproxy GUI ${version}" \
              --verify-tag
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --draft \
              --title "Wireproxy GUI ${version}" \
              --generate-notes
          fi

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    needs: [test, prepare-release]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.prepare-release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            goos: windows
            goarch: amd64
          - target: windows-aarch64
            goos: windows
            goarch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build release artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '0.0.0' }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          rm -rf dist/release/artifacts
          RELEASE_VERSION="$RELEASE_TAG" GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" scripts/build-release.sh

      - name: Keep artifact for smoke test
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.target }}
          path: dist/release/artifacts/

      - name: Upload release asset
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: gh release upload "$TAG_NAME" dist/release/artifacts/* --clobber

  build-linux:
    name: Build linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: [test, prepare-release]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.prepare-release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum

      - name: Install GUI runtime dependencies for the smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libayatana-appindicator3-1 xvfb

      - name: Build release artifact
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || '0.0.0' }}
          GOTOOLCHAIN: auto
        run: scripts/build-release.sh

      - name: Smoke test (launch GUI)
        run: |
          dir=$(mktemp -d)
          tar -xzf dist/release/artifacts/*.tar.gz -C "$dir"
          HOME="$dir" WIREPROXY_GUI_SMOKE_TEST=1 timeout 60 xvfb-run -a "$dir"/*/wireproxy-gui

      - name: Upload release asset
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release upload "$TAG_NAME" dist/release/artifacts/* --clobber

  smoke-windows:
    name: Smoke test windows-amd64
    runs-on: windows-latest
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist-windows-amd64
          path: dist
      - name: Launch GUI
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath app
          $exe = Get-ChildItem app -Recurse -Filter *.exe | Select-Object -First 1
          $env:WIREPROXY_GUI_SMOKE_TEST = "1"
          $p = Start-Process $exe.FullName -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "GUI did not exit within 60s" }
          if ($p.ExitCode -ne 0) { throw "GUI exited with $($p.ExitCode)" }

  build-macos:
    name: Build macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: [test, prepare-release]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.prepare-release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum

      - name: Build release artifact
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || '0.0.0' }}
          GOTOOLCHAIN: auto
        run: scripts/build-release.sh

      # Hosted macOS runners have no GPU, so OpenGL windows cannot open there. Check the
      # bundle is complete, native for this arch, and its executable loads all its libraries.
      - name: Smoke test (verify app bundle)
        run: |
          dir=$(mktemp -d)
          ditto -x -k dist/release/artifacts/*.app.zip "$dir"
          app="$dir/Wireproxy GUI.app"
          plutil -lint "$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/icon.icns"
          lipo -archs "$app/Contents/MacOS/wireproxy-gui" | grep -qw "$(uname -m)"
          codesign --verify --verbose "$app"
          # Only OS libraries may be linked; anything else would be missing on users' Macs.
          if otool -L "$app/Contents/MacOS/wireproxy-gui" | tail -n +2 | awk '{print $1}' | grep -vE '^(/System/|/usr/lib/)'; then
            echo "non-system dependency found"; exit 1
          fi

      - name: Keep artifact for smoke test
        uses: actions/upload-artifact@v5
        with:
          name: dist-macos-${{ matrix.arch }}
          path: dist/release/artifacts/

      - name: Upload release asset
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release upload "$TAG_NAME" dist/release/artifacts/* --clobber

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    needs: [build, build-linux, build-macos, smoke-windows]
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: gh release edit "$TAG_NAME" --draft=false --latest
